<!doctype html>
<!-- Template for icons/og-image.png (1200×630). Render with: sh tools/og/render.sh -->
<html lang="en"><head><meta charset="utf-8"><title>Khareeta OG image</title>
<style>
@font-face{font-family:Inter;font-weight:500;src:url(../../fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(../../fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Arabic';font-weight:500;src:url(../../fonts/noto-sans-arabic-arabic-500-normal.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:linear-gradient(135deg,#11946c 0%,#073f2e 100%);color:#fff;font-family:Inter,'Noto Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:radial-gradient(circle 540px at 60% 45%,rgba(12,110,80,.55),rgba(12,110,80,0))}
svg.tex{position:absolute;inset:0}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding-bottom:30px}
.lockup{width:854px;height:auto;display:block}
.tag{font-size:31px;font-weight:500;opacity:.88;letter-spacing:-.005em;display:flex;gap:16px;align-items:center}
.tag [lang=ar]{font-family:'Noto Sans Arabic';font-size:32px}
.tag i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.7}
.url{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:24px;font-weight:600;opacity:.6}
</style></head>
<body>
<div class="glow"></div>
<svg class="tex" width="1200" height="630" viewBox="0 0 1200 630" fill="none" stroke="#fff" aria-hidden="true">
  <!-- "street" texture: deterministic curves, like the brand banner -->
  <g stroke-opacity=".07" stroke-width="2">
    <path d="M-20 80 C300 20 700 160 1220 60"/><path d="M-20 190 C260 260 820 120 1220 230"/><path d="M-20 300 C380 240 760 380 1220 280"/>
    <path d="M-20 420 C300 470 900 360 1220 470"/><path d="M-20 540 C420 500 800 610 1220 520"/>
  </g>
  <g stroke-opacity=".06" stroke-width="2">
    <path d="M120 -20 Q60 315 210 650"/><path d="M380 -20 Q470 315 330 650"/><path d="M640 -20 Q560 315 720 650"/><path d="M900 -20 Q1010 315 860 650"/><path d="M1100 -20 Q1040 315 1150 650"/>
  </g>
  <path d="M-40 517 C360 346 660 662 1240 220" stroke-opacity=".08" stroke-width="12" stroke-linecap="round"/>
  <path d="M744 -40 C840 252 1020 378 1140 670" stroke-opacity=".07" stroke-width="8"/>
</svg>
<div class="wrap">
  <img class="lockup" src="../../icons/logo-lockup-dark.svg" alt="Khareeta | خريطة">
  <div class="tag"><span>Free maps &amp; navigation for Syria</span><i></i><span lang="ar" dir="rtl">خرائط وملاحة مجانية في سوريا</span></div>
</div>
<div class="url">khareeta.app</div>
</body></html>
