# PR checks: voice tests, report tests, notes tests, health/emergency, place-info + photos unit tests, lang tests, world (names/worldwide) tests, iOS voice, VERSION, CNAME. Does not build or deploy anything (Pages deploy is unchanged).
name: pr-checks
on:
  pull_request:
    # all base branches, so stacked PRs (e.g. on feat/place-info) are checked too
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  BASE_REF: origin/${{ github.base_ref || 'main' }}

jobs:
  voice-tests:
    runs-on: ubuntu-latest
    # voice.test.js runs ~7.5 min locally and up to ~2× on shared runners → generous budget so CI is not flaky (P3)
    timeout-minutes: 50
    defaults:
      run:
        working-directory: tests/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # LTS line 24 (same as local test runs). lts/* resolves to Node 26, where the
          # Playwright 1.56 browser install hangs after the download (zip extraction).
          node-version: 24
          cache: npm
          cache-dependency-path: tests/voice/package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install Chromium (+ system deps)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        # The Playwright CDN download occasionally stalls after 100 % → per-attempt timeout + retry
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $i failed/stalled, retrying"
            rm -rf ~/.cache/ms-playwright/__dirlock 2>/dev/null || true
          done
          exit 1
      - name: Install system deps only (browser from cache)
        if: steps.pwcache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - run: npm test
        timeout-minutes: 35
      - name: Report queue (delayed Supabase POST survives sheet close + reload; mocked, Chromium)
        run: node report-queue.test.js
        timeout-minutes: 5
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-tests-out
          path: tests/voice/out/
          if-no-files-found: ignore
          retention-days: 7

  lang-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/lang/*.test.mjs'

  world-tests:
    # Pure Node unit tests: name fallback (name:ar → name → name:en → brand), worldwide search bias, world POI cells/cache.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/world/*.test.mjs'
      - run: node --test 'tests/poi/*.test.mjs'

  route-tests:
    # Route stop/waypoint search uses the main search pipeline (Arabic normalisation, local POI index).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/route/*.test.mjs'

  overture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/overture/*.test.mjs'
      - run: python3 -m unittest discover -s tests/overture -p 'test_*.py' -v

  ios-voice-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/ios/*.test.mjs'

  ios-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tests/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/voice/package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers (WebKit + Chromium)
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # System deps and browser download are split: each gets its own short per-attempt timeout + retry,
      # so one stalled apt/CDN attempt cannot eat the whole job budget.
      - name: Install system deps (WebKit + Chromium)
        timeout-minutes: 12
        # A stalled attempt killed by `timeout` can leave its apt-get child holding the dpkg lock →
        # apt waits for the lock, and leftovers are killed before a retry.
        run: |
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99kh-lock >/dev/null
          for i in 1 2 3; do
            timeout 200 npx playwright install-deps webkit chromium && exit 0
            echo "::warning::playwright install-deps attempt $i failed/stalled, retrying"
            sudo pkill -f 'apt-get' 2>/dev/null || true; sleep 3; sudo dpkg --configure -a || true
          done
          exit 1
      - name: Download WebKit + Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            timeout 180 npx playwright install webkit chromium && exit 0
            echo "::warning::playwright browser download attempt $i failed/stalled, retrying"
            rm -rf ~/.cache/ms-playwright/__dirlock 2>/dev/null || true
          done
          exit 1
      - name: Health sheet Nearby actions reachable (390×844 + shorter viewport, EN/AR/DE, WebKit + Chromium, mocked)
        run: node health-sheet.test.js
        timeout-minutes: 5
      - run: node ios-webkit.test.js
        timeout-minutes: 5
      - name: iPhone zoom (pinch/double-tap/buttons, no page overflow)
        run: node ios-zoom.test.js
        timeout-minutes: 5
      - name: Sheet drag (Chromium real touch + WebKit pointer/mouse)
        run: node sheet-drag.test.js
        timeout-minutes: 5
      - name: Report menu visible in half sheet (WebKit iPhone, DE/AR, mocked)
        run: node report-menu.test.js
        timeout-minutes: 5
      - name: Saved places + offline search (WebKit iPhone 390, setOffline, DE/AR)
        run: node saved-offline.test.js
        timeout-minutes: 5
      - name: Datensparmodus / data-saver (WebKit iPhone 390×844, DE/AR, Save-Data default, mocked)
        run: node data-saver.test.js
        timeout-minutes: 5
      - name: What's here – report choice closed until tapped, every reopen (WebKit + Chromium, DE/AR)
        run: node wh-menu.test.js
        timeout-minutes: 5
      - name: Action-row labels not clipped at 390 px (What's here + place sheet, DE/EN/AR, light/dark, WebKit + Chromium)
        run: node action-row.test.js
        timeout-minutes: 8
      - name: Share as image (buttons + PNG card, iPhone 390, DE/EN/AR, light/dark, WebKit + Chromium, mocked)
        run: node share-image.test.js
        timeout-minutes: 10
      - name: Map export print/PDF (WebKit iPhone 390×844, DE/AR, mocked)
        run: node map-export.test.js
        timeout-minutes: 5
      - name: Route action chips fully visible at 390×844 (DE/EN/AR, Chromium+WebKit, mocked)
        run: node route-chips.test.js
        timeout-minutes: 8
      - name: Category chip never jumps to Syria + GPS start (Germany view, mocked Overpass, DE/AR, WebKit + Chromium)
        run: node chip-view.test.js
        timeout-minutes: 8
      - name: Text search "Café" stays in the view (Berlin/Paris, no far fuzzy gazetteer hits; Homs from Syria; DE/AR, WebKit + Chromium)
        run: node text-search-view.test.js
        timeout-minutes: 8
      - name: Install / UTM funnel (first-touch, channel_language, appinstalled, WebKit iPhone 390×844, mocked)
        run: node utm-funnel.test.js
        timeout-minutes: 5
      - name: Nearest transit stops (GPS/place, EN/AR/DE, WebKit + Chromium, mocked)
        run: node transit-nearby.test.js
        timeout-minutes: 5
      - name: Upload iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-webkit-shots
          path: |
            tests/voice/out/ios/
            tests/voice/out/health-sheet/
            tests/voice/out/map-export/
            tests/voice/out/route-chips/
            tests/voice/out/data-saver/
            tests/voice/out/utm-funnel/
            tests/voice/out/transit-nearby/
          if-no-files-found: ignore
          retention-days: 7

  placeinfo-tests:
    # Pure Node unit tests (no npm deps): opening_hours parser, phone/website/social link builders.
    # Run in several device time zones – results must be identical (times are always Asia/Damascus).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          for tz in UTC America/Los_Angeles Asia/Damascus Pacific/Kiritimati; do
            echo "TZ=$tz"; TZ=$tz node --test 'tests/placeinfo/*.test.mjs' || exit 1
          done

  photos-tests:
    # Pure Node unit tests for js/photos.js (Commons/Wikidata photo sources, attribution parsing, SW cache bounds).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/photos/*.test.mjs'

  offline-tests:
    # Pure Node unit tests for js/cities.js (whole-city offline packs: tile lists, size estimate, quota, polite downloader).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/offline/*.test.mjs'

  saved-tests:
    # Pure Node unit tests: saved places CRUD/import/export (js/saved-core.js), Arabic normalisation + fuzzy search
    # over the bundled gazetteer (js/search-core.js, data/gazetteer-sy.json), SW precache + i18n wiring.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/saved/*.test.mjs'

  transit-tests:
    # Pure Node unit tests for the Servis/bus lines layer (js/transit-core.js, data/transit/*.json, SW/i18n wiring). No network.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/transit/*.test.mjs'

  share-tests:
    # Pure Node unit tests for "What's here?" + share links (js/share-core.js): deep-link parsing incl. invalid values,
    # Nominatim throttle + reverse cache, share text EN/AR/DE, open-now hidden hint, SW/i18n wiring. No network, no Supabase.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          for tz in UTC Europe/Berlin Asia/Damascus America/Los_Angeles Asia/Tokyo; do
            echo "TZ=$tz"; TZ=$tz node --test 'tests/share/*.test.mjs' || exit 1
          done

  report-tests:
    # Pure Node unit tests for in-app reports (js/report-core.js + analytics.sendNow): link allowlist, lookalike/Cyrillic
    # blocking, local rate limit, payload size, i18n EN/AR/DE. fetch is mocked – nothing is sent to Supabase.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/report/*.test.mjs'

  notes-tests:
    # Pure Node unit tests for "Report map error" (js/notes-core.js → OSM Notes API): text building, 60 s throttle,
    # error handling, no double send, EN/AR/DE. fetch is mocked – no real note is ever created.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/notes/*.test.mjs'

  analytics-tests:
    # Pure Node unit tests for UTM / channel_language / first-touch / appinstalled / funnel flags (js/analytics.js).
    # fetch is always mocked – never hits the production Supabase project.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/analytics/*.test.mjs'

  closures-tests:
    # Pure Node unit tests for community road reports (js/closures-core.js): payload rounding/anonymity, data/closures.json
    # validation + expiry, route proximity warning, moderator export script, EN/AR/DE neutral wording. fetch is mocked.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/closures/*.test.mjs'

  admin-tests:
    # Pure Node: nav-stats migration SQL expectations + admin.html nav rendering with mocked old/new payloads (no network).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/admin/*.test.mjs'

  health-tests:
    # Pure Node unit tests for Gesundheit/Notfall (js/health-core.js + wiring): Syrian numbers+sources,
    # tel: hrefs, i18n EN/AR/DE, nearby chip reuse, no Syria map jump, no third-party APIs. No network.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'tests/health/*.test.mjs'

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/check-version.sh "$BASE_REF"

  cname:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/ci/check-cname.sh "$BASE_REF"
